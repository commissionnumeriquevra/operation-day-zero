<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>FRAGMENT ALPHA</title>
<link rel="stylesheet" href="style.css">
<style>:root{--c:#ffaa00}body{color:var(--c)}
.qp{max-width:480px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.qt{font-size:11px;letter-spacing:3px;opacity:.5;margin-bottom:8px;text-align:center}
.qh{font-family:'VT323',monospace;font-size:30px;letter-spacing:4px;color:var(--c);text-align:center;margin-bottom:22px}
.kbox{border:3px solid var(--c);border-radius:8px;padding:26px;text-align:center;background:rgba(255,170,0,.05);margin-bottom:18px}
.klbl{font-size:11px;letter-spacing:3px;opacity:.6;margin-bottom:12px}
.kval{font-family:'VT323',monospace;font-size:82px;color:var(--c);line-height:1}
.qd{font-size:13px;line-height:1.8;opacity:.75;text-align:center}
.qf{text-align:center;margin-top:20px;font-size:10px;letter-spacing:2px;opacity:.35}</style></head><body>
<div class="qp">
<div class="qt">// SIGNAL INTERCEPTE //</div>
<div class="qh">FRAGMENT ALPHA</div>
<div class="kbox"><div class="klbl">CLE DE DECHIFFREMENT CESAR</div><div class="kval">7</div></div>
<div class="qd">Transmettez immediatement cette cle au <strong>CRYPTOGRAPHE (PC 01)</strong>.<br>Sans elle, il ne peut rien decoder.</div>
<div class="qf">GHOST — TRANSMISSION 1/3</div>
</div></body></html>

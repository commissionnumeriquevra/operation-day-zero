<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPERATION DAY ZERO — CHRONO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Orbitron:wght@700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050506;overflow:hidden;font-family:'Share Tech Mono',monospace;cursor:none}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:1}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.14) 3px,rgba(0,0,0,.14) 6px);pointer-events:none;z-index:3}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
.top{font-family:'VT323',monospace;font-size:2.4vh;letter-spacing:1.4vh;color:rgba(255,60,40,.3)}
.cbox{position:relative;display:inline-block}
.chrono,.ghost{font-family:'Orbitron','VT323',monospace;font-size:26vh;line-height:.95;letter-spacing:1.4vh;font-weight:700}
.ghost{position:absolute;inset:0;color:rgba(255,0,0,.085);z-index:0;pointer-events:none}
.chrono{position:relative;z-index:1;color:#ff1408;text-shadow:0 0 1.2vh rgba(255,20,8,.95),0 0 5vh rgba(255,0,0,.55),0 0 11vh rgba(255,0,0,.3)}
.chrono.w1{color:#ff1408}
.chrono.w2{color:#ff2a08;text-shadow:0 0 1.4vh rgba(255,40,8,1),0 0 6vh rgba(255,0,0,.6),0 0 13vh rgba(255,0,0,.35)}
.chrono.w3{color:#ff3a10;text-shadow:0 0 1.6vh rgba(255,60,16,1),0 0 7vh rgba(255,0,0,.7),0 0 15vh rgba(255,0,0,.45);animation:puls .9s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.45}}
.phase{font-family:'VT323',monospace;font-size:3.4vh;letter-spacing:1.2vh;color:rgba(255,70,40,.45)}
.sync{display:flex;gap:1.2vh;margin-top:1vh}
.sd{width:5vh;height:1vh;border-radius:.5vh;background:rgba(255,255,255,.08);transition:all .5s}
.sd.on{background:#00cc44;box-shadow:0 0 1.6vh rgba(0,204,68,.7)}
.att{font-family:'VT323',monospace;font-size:7vh;letter-spacing:1.6vh;color:rgba(255,40,20,.28)}
.fin{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2vh}
.fin.show{display:flex}
.fin .t{font-family:'VT323',monospace;font-size:16vh;line-height:.9;letter-spacing:1.5vh;text-align:center}
.fin .s{font-family:'VT323',monospace;font-size:3.4vh;letter-spacing:1vh;opacity:.6}
#fv{background:rgba(0,10,4,.97)}#fv .t{color:#00ff44}
#fd{background:rgba(10,0,0,.97)}#fd .t{color:#ff2200}

.radio{margin-top:3vh;border:2px solid rgba(255,40,20,.35);background:rgba(20,0,0,.5);border-radius:1vh;padding:2.6vh 4vh;text-align:center;max-width:78vw}
.rtit{font-family:'VT323',monospace;font-size:2.4vh;letter-spacing:1.1vh;color:rgba(255,70,40,.55);margin-bottom:1.6vh}
.wave{display:flex;align-items:flex-end;justify-content:center;gap:.5vh;height:6vh;margin-bottom:2vh}
.wb{width:.9vh;background:#ff2a10;border-radius:.2vh;height:12%;opacity:.5}
.cyr{font-family:'VT323',monospace;font-size:9vh;letter-spacing:.8vh;color:#ff5533;min-height:11vh;line-height:1.1;text-shadow:0 0 2vh rgba(255,60,30,.6)}
.cyr.gl{animation:cgl .11s steps(2) infinite}
@keyframes cgl{0%{transform:translateX(0);opacity:1}50%{transform:translateX(-.4vh);opacity:.62}100%{transform:translateX(.3vh);opacity:1}}
.grp{font-family:'VT323',monospace;font-size:2.6vh;letter-spacing:.9vh;color:rgba(255,120,80,.5);min-height:3.4vh}
.rin{display:flex;gap:1.4vh;justify-content:center;margin-top:2.4vh}
.rin input{width:26vh;background:rgba(0,0,0,.65);border:2px solid rgba(255,40,20,.4);border-radius:.5vh;color:#ff4422;font-family:'Share Tech Mono',monospace;font-size:3vh;padding:1.2vh 1.6vh;text-align:center;letter-spacing:.8vh;outline:none}
.rin button{background:rgba(0,0,0,.65);border:2px solid rgba(255,40,20,.4);border-radius:.5vh;color:#ff5533;font-family:'Share Tech Mono',monospace;font-size:2.2vh;letter-spacing:.5vh;padding:0 3vh;cursor:pointer}
.rin button:hover{border-color:#ff4422;color:#ff8866}
.rerr{font-family:'Share Tech Mono',monospace;font-size:2vh;letter-spacing:.4vh;color:#ff3322;min-height:2.6vh;margin-top:1.2vh}
.rwarn{position:fixed;bottom:1.5vh;left:1.5vh;font-family:'Share Tech Mono',monospace;font-size:1.5vh;color:rgba(255,200,0,.5);z-index:9}

#mx{position:fixed;inset:0;z-index:0;opacity:.38;pointer-events:none}
.vign{position:fixed;inset:0;z-index:1;pointer-events:none;
 background:radial-gradient(ellipse 58% 44% at 50% 42%,rgba(0,0,0,.94) 0%,rgba(0,0,0,.84) 40%,rgba(0,0,0,.3) 72%,transparent 100%)}
.wrap{z-index:2}
.flash{position:fixed;inset:0;z-index:6;pointer-events:none;background:rgba(255,20,0,0);transition:background .12s}
.flash.on{background:rgba(255,20,0,.30)}
.alerte{position:fixed;top:5vh;left:0;right:0;z-index:7;text-align:center;font-family:'VT323',monospace;
 font-size:4.4vh;letter-spacing:1.5vh;color:#ff2a10;text-shadow:0 0 2vh rgba(255,40,0,.9);opacity:0;transition:opacity .25s}
.alerte.on{opacity:1}
</style></head><body>
<canvas id="mx"></canvas><div class="vign"></div><div class="flash" id="fl"></div><div class="alerte" id="al"></div>

<div class="wrap" id="scr">
  <div id="att" class="att">EN ATTENTE <span id="bl">_</span></div>
  <div id="jeu" style="display:none;text-align:center">
    <div class="top">// OPERATION DAY ZERO //</div>
    <div class="cbox"><div class="ghost">88:88</div><div class="chrono" id="ch">57:00</div></div>
    <div class="phase" id="ph">SYSTEMES ACTIFS</div>
    <div class="sync" id="sy"></div>
    <div class="radio" id="rad">
      <div class="rtit">// TRANSMISSION INTERCEPTEE — 4.72 MHz //</div>
      <div class="wave" id="wv"></div>
      <div class="cyr" id="cy">&nbsp;</div>
      <div class="grp" id="gp">&nbsp;</div>
      <div class="rin"><input id="rc" maxlength="9" placeholder="______"><button onclick="valCoffre()">[ VALIDER ]</button></div>
      <div class="rerr" id="re"></div>
    </div>
  </div>
<div class="rwarn" id="rw" style="display:none"></div>
</div>

<div class="fin" id="fv"><div class="t">DESARMEMENT<br>CONFIRME</div><div class="s">LES SILOS SONT NEUTRALISES</div></div>
<div class="fin" id="fd"><div class="t">LANCEMENT<br>CONFIRME</div><div class="s">IL EST TROP TARD</div></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
const FB={apiKey:"AIzaSyBZWH8FTWxnjFMgV7aUphiT3RLoaO57Ns4",authDomain:"operation-day-zero.firebaseapp.com",databaseURL:"https://operation-day-zero-default-rtdb.firebaseio.com",projectId:"operation-day-zero",storageBucket:"operation-day-zero.firebasestorage.app",messagingSenderId:"955748193348",appId:"1:955748193348:web:2de3150288aa136725d811"};
const db=getDatabase(initializeApp(FB));
const DUREE=57*60;
let temps=DUREE,phase='attente';

for(let i=0;i<6;i++){const d=document.createElement('div');d.className='sd';d.id='sd'+i;document.getElementById('sy').appendChild(d);}
setInterval(()=>{const b=document.getElementById('bl');if(b)b.style.opacity=b.style.opacity==='0'?'1':'0';},600);


// ---------- PLUIE MATRIX ----------
(function(){
 const cv=document.getElementById('mx'),cx=cv.getContext('2d');
 const CH='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 let col=[],taille=18;
 function dim(){cv.width=innerWidth;cv.height=innerHeight;taille=Math.max(14,Math.round(innerWidth/105));
  col=new Array(Math.ceil(cv.width/taille)).fill(0).map(()=>Math.random()*-70);}
 dim();addEventListener('resize',dim);
 setInterval(()=>{
  cx.fillStyle='rgba(0,0,0,.065)';cx.fillRect(0,0,cv.width,cv.height);
  cx.font=taille+'px monospace';
  for(let i=0;i<col.length;i++){
   const c=CH[Math.floor(Math.random()*CH.length)],x=i*taille,y=col[i]*taille;
   cx.fillStyle='#d4ffe2';cx.fillText(c,x,y);
   cx.fillStyle='#00ff41';cx.fillText(CH[Math.floor(Math.random()*CH.length)],x,y-taille);
   if(y>cv.height&&Math.random()>.972)col[i]=0;
   col[i]++;
  }
 },60);
})();

// ---------- SIRENES D'ALERTE ----------
const PALIERS=[3000,2400,1800,1200,600,300,60];
let sonnes=new Set(),tPrec=null;
function flash(n){const f=document.getElementById('fl');let i=0;
 const t=setInterval(()=>{f.classList.toggle('on');if(++i>=n*2){clearInterval(t);f.classList.remove('on');}},170);}
function banniere(txt,ms){const a=document.getElementById('al');a.textContent=txt;a.classList.add('on');
 setTimeout(()=>a.classList.remove('on'),ms);}
function sirene(crit){
 try{
  if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  const t=ac.currentTime,n=crit?4:2,d=crit?.55:.85;
  for(let i=0;i<n;i++){
   const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
   f.type='lowpass';f.frequency.value=crit?2200:1700;
   const s0=t+i*d,f1=crit?540:360,f2=crit?920:660;
   o.type='sawtooth';
   o.frequency.setValueAtTime(f1,s0);
   o.frequency.linearRampToValueAtTime(f2,s0+d*.5);
   o.frequency.linearRampToValueAtTime(f1,s0+d);
   g.gain.setValueAtTime(.0001,s0);
   g.gain.linearRampToValueAtTime(crit?.26:.19,s0+.06);
   g.gain.setValueAtTime(crit?.26:.19,s0+d-.12);
   g.gain.exponentialRampToValueAtTime(.0001,s0+d);
   o.connect(f);f.connect(g);g.connect(ac.destination);
   o.start(s0);o.stop(s0+d);
  }
 }catch(e){}
}
function verifPaliers(t){
 if(tPrec===null){tPrec=t;return;}
 for(const p of PALIERS){
  if(tPrec>p&&t<=p&&!sonnes.has(p)){
   sonnes.add(p);const crit=p<=300,m=Math.floor(p/60);
   sirene(crit);flash(crit?5:3);
   banniere('/// '+m+' MINUTE'+(m>1?'S':'')+(crit?' — CRITIQUE':'')+' ///',crit?4200:3200);
  }
 }
 tPrec=t;
}

// ====== CODE DU COFFRE — modifiable ici ======
const CADENAS_1='274', CADENAS_2='816';
// =============================================
const MOTS={'0':'НОЛЬ','1':'ОДИН','2':'ДВА','3':'ТРИ','4':'ЧЕТЫРЕ','5':'ПЯТЬ','6':'ШЕСТЬ','7':'СЕМЬ','8':'ВОСЕМЬ','9':'ДЕВЯТЬ'};
let coffreOk=false,radioOn=false,ac=null,voixRu=null;

for(let i=0;i<26;i++){const b=document.createElement('div');b.className='wb';document.getElementById('wv').appendChild(b);}
setInterval(()=>{if(!radioOn)return;document.querySelectorAll('.wb').forEach(b=>{b.style.height=(8+Math.random()*92)+'%';b.style.opacity=.35+Math.random()*.6;});},110);

function chercherVoix(){
 const v=speechSynthesis.getVoices();
 voixRu=v.find(x=>x.lang&&x.lang.toLowerCase().startsWith('ru'))||null;
 const w=document.getElementById('rw');
 if(!voixRu&&v.length){w.style.display='block';w.textContent='! aucune voix russe installee — la prononciation sera approximative';}
}
speechSynthesis.onvoiceschanged=chercherVoix;chercherVoix();

function parasites(d){
 return new Promise(r=>{
  try{
   if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
   const sr=ac.sampleRate,b=ac.createBuffer(1,Math.floor(sr*d),sr),c=b.getChannelData(0);
   for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(.3+Math.random()*.7);
   const s2=ac.createBufferSource();s2.buffer=b;
   const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;f.Q.value=.8;
   const g=ac.createGain();g.gain.value=.05;
   s2.connect(f);f.connect(g);g.connect(ac.destination);s2.start();
  }catch(e){}
  setTimeout(r,d*1000);
 });
}
function dire(txt){
 return new Promise(r=>{
  try{
   const u=new SpeechSynthesisUtterance(txt);
   u.lang='ru-RU';u.rate=.72;u.pitch=.85;
   if(voixRu)u.voice=voixRu;
   u.onend=r;u.onerror=r;
   speechSynthesis.speak(u);
   setTimeout(r,3500);
  }catch(e){r();}
 });
}
const attendre=ms=>new Promise(r=>setTimeout(r,ms));

async function serie(code,libelle){
 document.getElementById('gp').textContent=libelle;
 for(const ch of code){
  if(coffreOk||!radioOn)return;
  const m=MOTS[ch];
  const el=document.getElementById('cy');
  el.textContent=m;el.className='cyr gl';
  await dire(m);
  await attendre(260);
  el.className='cyr';
  await parasites(.35);
  if(coffreOk||!radioOn)return;
 }
 document.getElementById('cy').innerHTML='&nbsp;';
 document.getElementById('gp').innerHTML='&nbsp;';
}
async function transmission(){
 if(radioOn)return;
 radioOn=true;
 while(radioOn&&!coffreOk){
  await parasites(.9);
  if(coffreOk||!radioOn)break;
  await serie(CADENAS_1,'ПЕРВАЯ ГРУППА');
  if(coffreOk||!radioOn)break;
  await parasites(1.1);
  await serie(CADENAS_2,'ВТОРАЯ ГРУППА');
  if(coffreOk||!radioOn)break;
  await attendre(2600);
 }
 radioOn=false;
}
function stopRadio(){
 radioOn=false;coffreOk=true;
 try{speechSynthesis.cancel();}catch(e){}
 document.getElementById('rad').style.display='none';
}
window.valCoffre=()=>{
 const v=document.getElementById('rc').value.replace(/[^0-9]/g,'');
 if(v===CADENAS_1+CADENAS_2){document.getElementById('re').textContent='';stopRadio();}
 else document.getElementById('re').textContent='CODE REFUSE';
};
document.addEventListener('keydown',e=>{if(e.key==='S'&&e.shiftKey&&!coffreOk)stopRadio();});

onValue(ref(db,'game'),snap=>{
 const g=snap.val();if(!g)return;
 const avant=phase;phase=g.phase||'attente';temps=g.temps||DUREE;
 if(phase==='jeu')verifPaliers(temps);
 const m=String(Math.floor(temps/60)).padStart(2,'0'),s=String(temps%60).padStart(2,'0');
 const c=document.getElementById('ch');c.textContent=m+':'+s;
 c.className='chrono'+(temps<300?' w3':temps<720?' w2':temps<1620?' w1':'');
 document.getElementById('ph').textContent=temps<300?'ALERTE CRITIQUE':temps<720?'SYSTEMES INSTABLES':'SYSTEMES ACTIFS';
 const n=g.sync||0;
 for(let i=0;i<6;i++)document.getElementById('sd'+i).classList.toggle('on',i<n);

 if(phase==='jeu'){
  if(!coffreOk)transmission();
  document.getElementById('att').style.display='none';
  document.getElementById('jeu').style.display='block';
  
 }
 if(phase==='attente'){
  document.getElementById('att').style.display='block';
  document.getElementById('jeu').style.display='none';
  coffreOk=false;radioOn=false;sonnes.clear();tPrec=null;try{speechSynthesis.cancel();}catch(e){}
  document.getElementById('rad').style.display='block';document.getElementById('rc').value='';
  document.getElementById('fv').classList.remove('show');
  document.getElementById('fd').classList.remove('show');
  
 }
 if(phase==='victoire'){stopRadio();document.getElementById('fv').classList.add('show');}
 if(phase==='defaite'){stopRadio();document.getElementById('fd').classList.add('show');}
});
</script></body></html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACCES BOITE SECURISEE — GAMMA</title>
<link rel="stylesheet" href="style.css">
<style>
  :root{--c:#ffaa00;}
  body{color:var(--c);}
  .qr-page{max-width:480px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;}
  .qr-hdr{text-align:center;margin-bottom:24px;}
  .qr-tag{font-size:11px;letter-spacing:3px;opacity:0.5;margin-bottom:8px;}
  .qr-title{font-family:'VT323',monospace;font-size:32px;letter-spacing:4px;color:var(--c);}
  .gamma-box{border:3px solid var(--c);border-radius:8px;padding:24px;text-align:center;background:rgba(255,170,0,0.05);margin-bottom:20px;}
  .gamma-icon{font-size:40px;margin-bottom:10px;}
  .gamma-lbl{font-size:11px;letter-spacing:3px;opacity:0.6;margin-bottom:10px;}
  .gamma-code{font-family:'VT323',monospace;font-size:56px;letter-spacing:10px;color:var(--c);font-weight:bold;}
  .qr-desc{font-size:13px;line-height:1.8;opacity:0.7;text-align:center;}
  .qr-footer{text-align:center;margin-top:20px;font-size:10px;letter-spacing:2px;opacity:0.35;}
</style>
</head>
<body>
<div class="qr-page">
  <div class="qr-hdr">
    <div class="qr-tag">// ACCES SECURISE DETECTE //</div>
    <div class="qr-title">CODE GAMMA</div>
  </div>

  <div class="gamma-box">
    <div class="gamma-icon">🔒</div>
    <div class="gamma-lbl">CODE DU CADENAS</div>
    <div class="gamma-code">238</div>
  </div>

  <div class="qr-desc">Ce code déverrouille la boîte sécurisée cachée dans la salle. Ne le communiquez qu'à votre équipe.</div>

  <div class="qr-footer">GHOST — ACCES PRIORITAIRE</div>
</div>
</body>
</html>

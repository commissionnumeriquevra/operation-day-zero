<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>CARTE BETA</title>
<link rel="stylesheet" href="style.css">
<style>:root{--c:#ffaa00}body{color:var(--c)}
.qp{max-width:480px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.qt{font-size:11px;letter-spacing:3px;opacity:.5;margin-bottom:8px;text-align:center}
.qh{font-family:'VT323',monospace;font-size:30px;letter-spacing:4px;color:var(--c);text-align:center;margin-bottom:20px}
.tbl{border:2px solid rgba(255,170,0,.35);border-radius:6px;overflow:hidden;margin-bottom:18px}
.tr{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px solid rgba(255,170,0,.12);font-size:15px;letter-spacing:2px}
.tr:last-child{border-bottom:none}
.tr.hd{background:rgba(255,170,0,.12);font-size:10px;letter-spacing:2px;opacity:.7}
.tr b{font-family:'VT323',monospace;font-size:22px;color:var(--c)}
.qd{font-size:13px;line-height:1.8;opacity:.75;text-align:center}
.qf{text-align:center;margin-top:20px;font-size:10px;letter-spacing:2px;opacity:.35}</style></head><body>
<div class="qp">
<div class="qt">// RELEVE SATELLITE //</div>
<div class="qh">CARTE BETA</div>
<div class="tbl">
<div class="tr hd"><span>SECTEUR</span><span>LATITUDE</span></div>
<div class="tr"><span>ABYSSAL</span><b>08&deg; N</b></div>
<div class="tr"><span>AUSTRAL</span><b>14&deg; N</b></div>
<div class="tr"><span>MERIDIEN</span><b>25&deg; N</b></div>
<div class="tr"><span>EQUATOR</span><b>33&deg; N</b></div>
<div class="tr"><span>BOREAL</span><b>47&deg; N</b></div>
<div class="tr"><span>ARCTIC</span><b>58&deg; N</b></div>
</div>
<div class="qd">Transmettez ce releve a l'<strong>ANALYSTE (PC 02)</strong>.<br>Plus la latitude est elevee, plus le silo est au nord.</div>
<div class="qf">GHOST — TRANSMISSION 2/3</div>
</div></body></html>
